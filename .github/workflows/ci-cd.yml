name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]


env:
  REGISTRY_URL: "index.docker.io"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test

  deploy:
    # Only publish the image when code lands on main (not for pull requests)
    needs: test
    # research depends on 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # setup Docker build action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.G_TOKEN }}

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.G_TOKEN }}

      - name: Build backend image
        run: docker build -t $(echo $REGISTRY_URL)/$(echo ${{ secrets.DOCKER_USER }})/${{ vars.APP_IMAGE }}:$(echo $GITHUB_SHA | head -c24) .

      - name: Push backend image to Container Registry
        run: docker push $(echo $REGISTRY_URL)/$(echo ${{ secrets.DOCKER_USER }})/${{ vars.APP_IMAGE }}:$(echo $GITHUB_SHA | head -c24)

        #docker push $(echo $REGISTRY_URL)/$(echo ${{ secrets.DOCKER_USER }})/$(echo ${{ secrets.STAGE_APP_IMAGE }}):$(echo $GITHUB_SHA | head -c24)
        #

    

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}





